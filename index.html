<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="A clean, modern to-do list app." />
<meta name="theme-color" content="#4f46e5" />
<title>Tasks — To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<style>
  /* ───────────── Design tokens ───────────── */
  :root {
    --bg: #f4f5f9;
    --bg-accent-1: rgba(99, 102, 241, 0.18);
    --bg-accent-2: rgba(236, 72, 153, 0.12);
    --surface: rgba(255, 255, 255, 0.82);
    --surface-solid: #ffffff;
    --surface-2: #f1f2f6;
    --border: rgba(15, 23, 42, 0.08);
    --text: #0f172a;
    --text-2: #475569;
    --text-3: #94a3b8;
    --primary: #4f46e5;
    --primary-2: #7c3aed;
    --primary-soft: rgba(79, 70, 229, 0.1);
    --danger: #e11d48;
    --danger-soft: rgba(225, 29, 72, 0.1);
    --high: #ef4444;
    --medium: #f59e0b;
    --low: #10b981;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 20px 50px -12px rgba(15, 23, 42, 0.25);
    --radius: 16px;
    --radius-sm: 10px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0b0d14;
    --bg-accent-1: rgba(99, 102, 241, 0.22);
    --bg-accent-2: rgba(236, 72, 153, 0.1);
    --surface: rgba(22, 25, 36, 0.78);
    --surface-solid: #161924;
    --surface-2: #1e2230;
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8eaf2;
    --text-2: #a3a9bd;
    --text-3: #636a80;
    --primary: #818cf8;
    --primary-2: #a78bfa;
    --primary-soft: rgba(129, 140, 248, 0.14);
    --danger: #fb7185;
    --danger-soft: rgba(251, 113, 133, 0.12);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }

  /* ───────────── Base ───────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
    overflow-x: hidden;
  }
  /* Soft animated gradient blobs */
  body::before, body::after {
    content: "";
    position: fixed;
    width: 520px; height: 520px;
    border-radius: 50%;
    filter: blur(90px);
    z-index: -1;
    pointer-events: none;
    animation: float 18s ease-in-out infinite alternate;
  }
  body::before { background: var(--bg-accent-1); top: -160px; left: -120px; }
  body::after  { background: var(--bg-accent-2); bottom: -180px; right: -140px; animation-delay: -9s; }
  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(60px, 40px) scale(1.12); }
  }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    animation: rise 0.7s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* ───────────── Header ───────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }
  .greeting small {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-3);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .greeting h1 {
    font-size: clamp(1.7rem, 4vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .greeting h1 span {
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(12px);
    transition: transform 0.25s var(--spring), background 0.2s;
    flex-shrink: 0;
  }
  .icon-btn:hover { transform: translateY(-2px) rotate(-8deg); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { width: 20px; height: 20px; }
  .theme-icon-sun { display: none; }
  [data-theme="dark"] .theme-icon-sun { display: block; animation: spinIn 0.5s var(--spring); }
  [data-theme="dark"] .theme-icon-moon { display: none; }
  :root:not([data-theme="dark"]) .theme-icon-moon { animation: spinIn 0.5s var(--spring); }
  @keyframes spinIn { from { transform: rotate(-90deg) scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ───────────── Card / panel ───────────── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  /* ───────────── Stats ───────────── */
  .stats {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .ring { position: relative; width: 68px; height: 68px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--surface-2); }
  .ring .bar {
    stroke: url(#ringGrad);
    stroke-linecap: round;
    stroke-dasharray: 188.5;
    stroke-dashoffset: 188.5;
    transition: stroke-dashoffset 0.8s var(--ease);
  }
  .ring-label {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 0.9rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stats-text { flex: 1; min-width: 0; }
  .stats-text strong { display: block; font-size: 1.02rem; font-weight: 600; }
  .stats-text span { font-size: 0.875rem; color: var(--text-2); }
  .stat-pills { display: flex; gap: 8px; }
  .stat-pill {
    text-align: center;
    padding: 8px 14px;
    border-radius: 12px;
    background: var(--surface-2);
    min-width: 64px;
  }
  .stat-pill b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat-pill small { font-size: 0.7rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .bump { animation: bump 0.4s var(--spring); }
  @keyframes bump { 50% { transform: scale(1.25); } }

  /* ───────────── Composer ───────────── */
  .composer { padding: 10px; margin-bottom: 20px; transition: box-shadow 0.3s, border-color 0.3s; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--primary) 40%, transparent); box-shadow: var(--shadow), 0 0 0 4px var(--primary-soft); }
  .composer-row { display: flex; gap: 8px; align-items: center; }
  .composer input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 12px 12px;
    font-size: 1rem;
    outline: none;
  }
  .composer input::placeholder { color: var(--text-3); }
  .add-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 11px 18px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff;
    font-weight: 600;
    font-size: 0.92rem;
    box-shadow: 0 6px 16px -6px var(--primary);
    transition: transform 0.25s var(--spring), box-shadow 0.25s, opacity 0.2s;
    white-space: nowrap;
  }
  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -8px var(--primary); }
  .add-btn:active { transform: scale(0.95); }
  .add-btn svg { width: 18px; height: 18px; }
  .composer-meta {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 8px 6px 2px;
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }
  .chip-select {
    position: relative;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    font-size: 0.8rem;
    color: var(--text-2);
    font-weight: 500;
    transition: background 0.2s;
  }
  .chip-select:hover { background: var(--primary-soft); color: var(--primary); }
  .chip-select svg { width: 14px; height: 14px; }
  .chip-select select, .chip-select input {
    border: none; background: transparent; outline: none;
    font-size: 0.8rem; color: inherit; font-weight: 500; cursor: pointer;
  }
  .chip-select input[type="date"] { width: 118px; }
  .chip-select input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
  [data-theme="dark"] .chip-select input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
  .chip-select select option { background: var(--surface-solid); color: var(--text); }
  .shake { animation: shake 0.4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ───────────── Toolbar ───────────── */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .tabs {
    position: relative;
    display: inline-flex;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(12px);
  }
  .tab {
    position: relative; z-index: 1;
    padding: 7px 14px;
    font-size: 0.85rem; font-weight: 600;
    color: var(--text-2);
    border-radius: 9px;
    transition: color 0.25s;
  }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab .count {
    display: inline-block;
    margin-left: 6px;
    font-size: 0.72rem;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .tab-indicator {
    position: absolute; top: 4px; bottom: 4px; left: 0;
    background: var(--surface-solid);
    border-radius: 9px;
    box-shadow: var(--shadow-sm), 0 0 0 1px var(--border);
    transition: transform 0.4s var(--spring), width 0.4s var(--spring);
  }
  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    height: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    flex: 1; min-width: 160px; max-width: 260px;
    backdrop-filter: blur(12px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search:focus-within { border-color: color-mix(in srgb, var(--primary) 40%, transparent); box-shadow: 0 0 0 3px var(--primary-soft); }
  .search svg { width: 16px; height: 16px; color: var(--text-3); flex-shrink: 0; }
  .search input { border: none; background: transparent; outline: none; width: 100%; font-size: 0.875rem; }
  .search kbd {
    font-family: inherit; font-size: 0.7rem; color: var(--text-3);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
  }

  /* ───────────── Task list ───────────── */
  .list { list-style: none; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .task {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 14px 14px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(12px);
    transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), opacity 0.3s, background 0.3s;
    animation: taskIn 0.45s var(--spring) both;
  }
  .task:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .task::before {
    content: "";
    position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 3px; border-radius: 0 3px 3px 0;
    background: var(--prio, transparent);
  }
  .task[data-priority="high"]   { --prio: var(--high); }
  .task[data-priority="medium"] { --prio: var(--medium); }
  .task[data-priority="low"]    { --prio: var(--low); }
  @keyframes taskIn { from { opacity: 0; transform: translateY(-10px) scale(0.97); } to { opacity: 1; transform: none; } }
  .task.leaving { animation: taskOut 0.35s var(--ease) forwards; pointer-events: none; }
  @keyframes taskOut {
    to { opacity: 0; transform: translateX(40px) scale(0.96); height: 0; padding-top: 0; padding-bottom: 0; margin-top: -8px; border-width: 0; }
  }
  .task.dragging { opacity: 0.5; transform: scale(0.98); }
  .task.drag-over { box-shadow: 0 -3px 0 0 var(--primary), var(--shadow); }

  .drag-handle {
    color: var(--text-3);
    cursor: grab;
    opacity: 0;
    transition: opacity 0.2s;
    display: grid; place-items: center;
    margin-left: -4px; margin-right: -6px;
    touch-action: none;
  }
  .drag-handle svg { width: 16px; height: 16px; }
  .task:hover .drag-handle { opacity: 1; }
  .drag-handle:active { cursor: grabbing; }

  /* Custom checkbox */
  .check {
    position: relative;
    width: 24px; height: 24px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 2px solid var(--text-3);
    display: grid; place-items: center;
    transition: border-color 0.2s, background 0.3s var(--ease), transform 0.3s var(--spring);
  }
  .check:hover { border-color: var(--primary); transform: scale(1.08); }
  .check svg { width: 14px; height: 14px; }
  .check path {
    stroke: #fff; stroke-width: 3.5; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 24; stroke-dashoffset: 24;
    transition: stroke-dashoffset 0.35s var(--ease) 0.08s;
  }
  .task.done .check {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color: transparent;
    animation: pop 0.4s var(--spring);
  }
  .task.done .check path { stroke-dashoffset: 0; }
  @keyframes pop { 50% { transform: scale(1.25); } }
  .check::after {
    content: ""; position: absolute; inset: -6px;
    border-radius: 12px; border: 2px solid var(--primary);
    opacity: 0; transform: scale(0.6);
  }
  .task.just-done .check::after { animation: ripple 0.6s var(--ease); }
  @keyframes ripple { 0% { opacity: 0.7; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.5); } }

  .task-body { flex: 1; min-width: 0; }
  .task-title {
    position: relative;
    display: inline;
    font-size: 0.97rem;
    font-weight: 500;
    word-break: break-word;
    transition: color 0.3s;
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat;
    background-position: 0 55%;
    background-size: 0% 1.5px;
    transition: background-size 0.4s var(--ease), color 0.3s;
  }
  .task.done .task-title { color: var(--text-3); background-size: 100% 1.5px; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .task-meta:empty { display: none; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.72rem; font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-2);
  }
  .tag svg { width: 11px; height: 11px; }
  .tag.prio-high   { background: color-mix(in srgb, var(--high) 14%, transparent);   color: var(--high); }
  .tag.prio-medium { background: color-mix(in srgb, var(--medium) 16%, transparent); color: #c27803; }
  .tag.prio-low    { background: color-mix(in srgb, var(--low) 14%, transparent);    color: #059669; }
  [data-theme="dark"] .tag.prio-medium { color: var(--medium); }
  [data-theme="dark"] .tag.prio-low { color: var(--low); }
  .tag.overdue { background: var(--danger-soft); color: var(--danger); }
  .tag.today { background: var(--primary-soft); color: var(--primary); }

  .edit-input {
    width: 100%;
    font-size: 0.97rem; font-weight: 500;
    padding: 4px 8px; margin: -5px -9px;
    border-radius: 8px;
    border: 1px solid var(--primary);
    background: var(--surface-solid);
    outline: none;
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  .task-actions { display: flex; gap: 2px; opacity: 0; transform: translateX(6px); transition: opacity 0.2s, transform 0.25s var(--ease); }
  .task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; transform: none; }
  .act {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: grid; place-items: center;
    color: var(--text-3);
    transition: background 0.2s, color 0.2s, transform 0.2s var(--spring);
  }
  .act svg { width: 16px; height: 16px; }
  .act:hover { background: var(--surface-2); color: var(--text); transform: scale(1.08); }
  .act.delete:hover { background: var(--danger-soft); color: var(--danger); }
  @media (hover: none) {
    .task-actions { opacity: 1; transform: none; }
    .drag-handle { opacity: 0.6; }
  }

  /* ───────────── Empty state ───────────── */
  .empty {
    text-align: center;
    padding: 52px 20px;
    color: var(--text-2);
    animation: rise 0.5s var(--ease) both;
  }
  .empty-art {
    width: 96px; height: 96px;
    margin: 0 auto 16px;
    border-radius: 28px;
    display: grid; place-items: center;
    background: var(--primary-soft);
    color: var(--primary);
    animation: bob 3.5s ease-in-out infinite;
  }
  .empty-art svg { width: 44px; height: 44px; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(3deg); } }
  .empty h3 { color: var(--text); font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
  .empty p { font-size: 0.9rem; }

  /* ───────────── Footer ───────────── */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px;
    font-size: 0.82rem;
    color: var(--text-3);
    gap: 12px;
    flex-wrap: wrap;
  }
  .link-btn {
    font-size: 0.82rem; font-weight: 500;
    color: var(--text-2);
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.2s, color 0.2s;
  }
  .link-btn:hover { background: var(--danger-soft); color: var(--danger); }
  .link-btn:disabled { opacity: 0.4; pointer-events: none; }
  .hints { display: flex; gap: 14px; flex-wrap: wrap; }
  .hints kbd {
    font-family: inherit; font-size: 0.7rem;
    border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 5px; padding: 0 5px;
    background: var(--surface);
  }

  /* ───────────── Toast ───────────── */
  .toast-wrap {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    z-index: 50;
    pointer-events: none;
    width: calc(100% - 32px);
  }
  .toast {
    pointer-events: auto;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 12px 12px 16px;
    background: #0f172a;
    color: #f1f5f9;
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    font-size: 0.88rem;
    max-width: 420px;
    animation: toastIn 0.45s var(--spring) both;
  }
  [data-theme="dark"] .toast { background: #f1f5f9; color: #0f172a; }
  .toast.out { animation: toastOut 0.3s var(--ease) forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(12px) scale(0.96); } }
  .toast button {
    font-weight: 600; font-size: 0.85rem;
    color: #a5b4fc;
    padding: 5px 10px; border-radius: 8px;
    transition: background 0.2s;
  }
  [data-theme="dark"] .toast button { color: var(--primary); color: #4f46e5; }
  .toast button:hover { background: rgba(255, 255, 255, 0.1); }
  [data-theme="dark"] .toast button:hover { background: rgba(0, 0, 0, 0.06); }

  /* Confetti */
  .confetti {
    position: fixed; top: 0; left: 0;
    width: 9px; height: 14px;
    pointer-events: none; z-index: 60;
    border-radius: 2px;
    will-change: transform, opacity;
  }

  /* ───────────── Responsive ───────────── */
  @media (max-width: 560px) {
    .app { padding: 28px 16px 72px; }
    .stats { flex-wrap: wrap; gap: 16px; padding: 18px; }
    .stat-pills { width: 100%; }
    .stat-pill { flex: 1; }
    .add-btn span { display: none; }
    .add-btn { padding: 11px 13px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .tabs { display: flex; }
    .tab { flex: 1; padding: 7px 6px; white-space: nowrap; }
    .search { max-width: none; flex: none; }
    .tabs { flex: none; }
    .search kbd, .hints { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <!-- SVG gradient for the progress ring -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#6366f1" />
        <stop offset="100%" stop-color="#a855f7" />
      </linearGradient>
    </defs>
  </svg>

  <main class="app">
    <header class="header">
      <div class="greeting">
        <small id="date"></small>
        <h1><span id="greet">Hello</span>, let's get things done.</h1>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <section class="panel stats" aria-label="Progress">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 68 68">
          <circle class="track" cx="34" cy="34" r="30" />
          <circle class="bar" id="ringBar" cx="34" cy="34" r="30" />
        </svg>
        <div class="ring-label" id="ringLabel">0%</div>
      </div>
      <div class="stats-text">
        <strong id="statsTitle">No tasks yet</strong>
        <span id="statsSub">Add your first task below to get started.</span>
      </div>
      <div class="stat-pills">
        <div class="stat-pill"><b id="statActive">0</b><small>Active</small></div>
        <div class="stat-pill"><b id="statDone">0</b><small>Done</small></div>
      </div>
    </section>

    <form class="panel composer" id="composer" autocomplete="off">
      <div class="composer-row">
        <label for="taskInput" class="sr-only">New task</label>
        <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="200" />
        <button type="submit" class="add-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add task</span>
        </button>
      </div>
      <div class="composer-meta">
        <label class="chip-select" title="Priority">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 1-1h11l-2 4 2 4H5"/></svg>
          <select id="prioInput" aria-label="Priority">
            <option value="none">No priority</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label class="chip-select" title="Due date">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <input type="date" id="dateInput" aria-label="Due date" />
        </label>
      </div>
    </form>

    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Filter tasks">
        <span class="tab-indicator" id="tabIndicator"></span>
        <button class="tab" role="tab" data-filter="all" aria-selected="true">All<span class="count" id="cAll">0</span></button>
        <button class="tab" role="tab" data-filter="active" aria-selected="false">Active<span class="count" id="cActive">0</span></button>
        <button class="tab" role="tab" data-filter="done" aria-selected="false">Completed<span class="count" id="cDone">0</span></button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr-only">Search tasks</span>
        <input type="search" id="searchInput" placeholder="Search tasks" />
        <kbd>/</kbd>
      </label>
    </div>

    <ul class="list" id="list" aria-live="polite"></ul>
    <div id="emptyState"></div>

    <footer class="footer">
      <div class="hints">
        <span><kbd>N</kbd> new task</span>
        <span><kbd>/</kbd> search</span>
        <span>Double-click to edit</span>
      </div>
      <button class="link-btn" id="clearDone">Clear completed</button>
    </footer>
  </main>

  <div class="toast-wrap" id="toasts" aria-live="assertive"></div>

<script>
(() => {
  "use strict";

  /* ───────── Storage (safe) ───────── */
  const KEY = "todo.tasks.v1";
  const THEME_KEY = "todo.theme";
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  /* ───────── State ───────── */
  let tasks = store.get(KEY, null);
  if (!Array.isArray(tasks)) {
    const today = isoDate(new Date());
    tasks = [
      { id: uid(), title: "Welcome! Click the circle to complete a task", done: false, priority: "medium", due: today, created: Date.now() },
      { id: uid(), title: "Double-click any task to edit it", done: false, priority: "low", due: "", created: Date.now() },
      { id: uid(), title: "Drag the handle to reorder tasks", done: false, priority: "none", due: "", created: Date.now() },
      { id: uid(), title: "Explore dark mode with the button up top", done: true, priority: "none", due: "", created: Date.now() }
    ];
  }
  let filter = "all";
  let query = "";
  let lastDeleted = null;

  /* ───────── Elements ───────── */
  const $ = (s) => document.querySelector(s);
  const list = $("#list"), emptyState = $("#emptyState");
  const form = $("#composer"), input = $("#taskInput"), prioInput = $("#prioInput"), dateInput = $("#dateInput");
  const searchInput = $("#searchInput");
  const tabs = [...document.querySelectorAll(".tab")], indicator = $("#tabIndicator");

  /* ───────── Helpers ───────── */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function isoDate(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
  function save() { store.set(KEY, tasks); }
  function escapeHTML(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function dueInfo(due) {
    if (!due) return null;
    const today = isoDate(new Date());
    const tomorrow = isoDate(new Date(Date.now() + 864e5));
    if (due === today) return { label: "Today", cls: "today" };
    if (due === tomorrow) return { label: "Tomorrow", cls: "" };
    const d = new Date(due + "T00:00:00");
    const label = d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: d.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined });
    return { label, cls: due < today ? "overdue" : "" };
  }

  const ICONS = {
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 22V4a1 1 0 0 1 1-1h11l-2 4 2 4H5"/></svg>'
  };

  /* ───────── Rendering ───────── */
  function visibleTasks() {
    const q = query.trim().toLowerCase();
    return tasks.filter((t) =>
      (filter === "all" || (filter === "active" ? !t.done : t.done)) &&
      (!q || t.title.toLowerCase().includes(q))
    );
  }

  function taskHTML(t) {
    const due = dueInfo(t.due);
    const meta = [
      t.priority && t.priority !== "none" ? `<span class="tag prio-${t.priority}">${ICONS.flag}${t.priority[0].toUpperCase() + t.priority.slice(1)}</span>` : "",
      due ? `<span class="tag ${t.done ? "" : due.cls}">${ICONS.cal}${due.label}</span>` : ""
    ].join("");
    return `
      <span class="drag-handle" draggable="true" aria-hidden="true" title="Drag to reorder">${ICONS.grip}</span>
      <button class="check" data-action="toggle" role="checkbox" aria-checked="${t.done}" aria-label="Mark “${escapeHTML(t.title)}” as ${t.done ? "not done" : "done"}">${ICONS.check}</button>
      <div class="task-body">
        <span class="task-title">${escapeHTML(t.title)}</span>
        <div class="task-meta">${meta}</div>
      </div>
      <div class="task-actions">
        <button class="act" data-action="edit" aria-label="Edit task" title="Edit">${ICONS.edit}</button>
        <button class="act delete" data-action="delete" aria-label="Delete task" title="Delete">${ICONS.trash}</button>
      </div>`;
  }

  function render({ animateIds = null } = {}) {
    const items = visibleTasks();
    const existing = new Map([...list.children].map((li) => [li.dataset.id, li]));
    const frag = document.createDocumentFragment();

    items.forEach((t) => {
      let li = existing.get(t.id);
      if (!li) {
        li = document.createElement("li");
        li.className = "task";
        li.dataset.id = t.id;
      } else {
        existing.delete(t.id);
        if (!animateIds || !animateIds.has(t.id)) li.style.animation = "none";
      }
      li.dataset.priority = t.priority || "none";
      li.classList.toggle("done", t.done);
      if (!li.querySelector(".edit-input")) li.innerHTML = taskHTML(t);
      frag.appendChild(li);
    });
    existing.forEach((li) => li.remove());
    list.innerHTML = "";
    list.appendChild(frag);

    renderEmpty(items.length);
    renderStats();
    save();
  }

  function renderEmpty(count) {
    if (count) { emptyState.innerHTML = ""; return; }
    const msgs = {
      search: ["No matches", `Nothing found for “${escapeHTML(query)}”.`],
      all: ["Your list is empty", "Add a task above — your future self will thank you."],
      active: ["All caught up!", "No active tasks. Enjoy the free time."],
      done: ["Nothing completed yet", "Finished tasks will show up here."]
    };
    const [h, p] = query.trim() ? msgs.search : msgs[filter];
    emptyState.innerHTML = `
      <div class="empty">
        <div class="empty-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 12l2.5 2.5L16 9.5"/></svg></div>
        <h3>${h}</h3><p>${p}</p>
      </div>`;
  }

  let prevStats = { active: -1, done: -1 };
  function renderStats() {
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const active = total - done;
    const pct = total ? Math.round((done / total) * 100) : 0;

    $("#ringBar").style.strokeDashoffset = 188.5 - (188.5 * pct) / 100;
    $("#ringLabel").textContent = pct + "%";
    setNum("#statActive", active, prevStats.active);
    setNum("#statDone", done, prevStats.done);
    $("#cAll").textContent = total;
    $("#cActive").textContent = active;
    $("#cDone").textContent = done;
    $("#clearDone").disabled = done === 0;

    let title, sub;
    if (!total) { title = "No tasks yet"; sub = "Add your first task below to get started."; }
    else if (!active) { title = "Everything's done 🎉"; sub = "You've completed all your tasks. Great work!"; }
    else if (pct >= 50) { title = "Great progress!"; sub = `${active} task${active > 1 ? "s" : ""} left — keep going.`; }
    else { title = `${active} task${active > 1 ? "s" : ""} to go`; sub = `${done} of ${total} completed so far.`; }
    $("#statsTitle").textContent = title;
    $("#statsSub").textContent = sub;
    prevStats = { active, done };
  }
  function setNum(sel, val, prev) {
    const el = $(sel);
    el.textContent = val;
    if (prev !== -1 && prev !== val) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  }

  /* ───────── Actions ───────── */
  function addTask(title) {
    const t = { id: uid(), title, done: false, priority: prioInput.value, due: dateInput.value, created: Date.now() };
    tasks.unshift(t);
    if (filter === "done") setFilter("all", false);
    render({ animateIds: new Set([t.id]) });
  }

  function toggleTask(id, li) {
    const t = tasks.find((x) => x.id === id);
    if (!t) return;
    t.done = !t.done;
    li.classList.toggle("done", t.done);
    if (t.done) { li.classList.add("just-done"); setTimeout(() => li.classList.remove("just-done"), 600); }
    const check = li.querySelector(".check");
    check.setAttribute("aria-checked", t.done);

    const needsHide = (filter === "active" && t.done) || (filter === "done" && !t.done);
    if (needsHide) {
      setTimeout(() => removeWithAnim(li, () => render()), 380);
    } else {
      // refresh meta (overdue styling) without re-animating
      li.querySelector(".task-meta").outerHTML = new DOMParser()
        .parseFromString(`<div>${taskHTML(t)}</div>`, "text/html").querySelector(".task-meta").outerHTML;
      renderStats(); save();
    }
    if (t.done && tasks.length > 0 && tasks.every((x) => x.done)) {
      const r = check.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
    }
  }

  function removeWithAnim(li, cb) {
    li.style.animation = "";
    li.style.height = li.offsetHeight + "px";
    li.classList.add("leaving");
    li.addEventListener("animationend", cb, { once: true });
  }

  function deleteTask(id, li) {
    const index = tasks.findIndex((x) => x.id === id);
    if (index < 0) return;
    lastDeleted = { task: tasks[index], index };
    tasks.splice(index, 1);
    removeWithAnim(li, () => render());
    toast("Task deleted", "Undo", () => {
      if (!lastDeleted) return;
      tasks.splice(Math.min(lastDeleted.index, tasks.length), 0, lastDeleted.task);
      const restored = lastDeleted.task.id;
      lastDeleted = null;
      render({ animateIds: new Set([restored]) });
    });
  }

  function startEdit(id, li) {
    const t = tasks.find((x) => x.id === id);
    if (!t || li.querySelector(".edit-input")) return;
    const titleEl = li.querySelector(".task-title");
    const field = document.createElement("input");
    field.className = "edit-input";
    field.value = t.title;
    field.maxLength = 200;
    field.setAttribute("aria-label", "Edit task title");
    titleEl.replaceWith(field);
    field.focus();
    field.setSelectionRange(field.value.length, field.value.length);

    let finished = false;
    const finish = (commit) => {
      if (finished) return; finished = true;
      const val = field.value.trim();
      if (commit && val) t.title = val;
      li.innerHTML = taskHTML(t);
      save();
      if (commit && !val) deleteTask(id, li);
    };
    field.addEventListener("keydown", (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    field.addEventListener("blur", () => finish(true));
  }

  function clearCompleted() {
    const doneEls = [...list.querySelectorAll(".task.done")];
    const removed = tasks.filter((t) => t.done);
    if (!removed.length) return;
    const snapshot = tasks.slice();
    tasks = tasks.filter((t) => !t.done);
    if (!doneEls.length) { render(); }
    doneEls.forEach((li, i) => {
      li.style.animationDelay = i * 40 + "ms";
      removeWithAnim(li, () => { if (i === doneEls.length - 1) render(); });
    });
    toast(`Cleared ${removed.length} completed task${removed.length > 1 ? "s" : ""}`, "Undo", () => {
      tasks = snapshot;
      render({ animateIds: new Set(removed.map((t) => t.id)) });
    });
  }

  /* ───────── Filters & tabs ───────── */
  function setFilter(f, doRender = true) {
    filter = f;
    tabs.forEach((t) => t.setAttribute("aria-selected", t.dataset.filter === f));
    moveIndicator();
    if (doRender) { list.innerHTML = ""; render({ animateIds: new Set(tasks.map((t) => t.id)) }); }
  }
  function moveIndicator() {
    const active = tabs.find((t) => t.getAttribute("aria-selected") === "true");
    indicator.style.width = active.offsetWidth + "px";
    indicator.style.transform = `translateX(${active.offsetLeft}px)`;
  }

  /* ───────── Toasts ───────── */
  function toast(msg, actionLabel, action) {
    const wrap = $("#toasts");
    wrap.querySelectorAll(".toast").forEach((t) => dismiss(t));
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<span>${escapeHTML(msg)}</span>`;
    if (actionLabel) {
      const b = document.createElement("button");
      b.textContent = actionLabel;
      b.onclick = () => { action(); dismiss(el); };
      el.appendChild(b);
    }
    wrap.appendChild(el);
    const timer = setTimeout(() => dismiss(el), 5000);
    el._timer = timer;
  }
  function dismiss(el) {
    if (el._gone) return; el._gone = true;
    clearTimeout(el._timer);
    el.classList.add("out");
    el.addEventListener("animationend", () => el.remove(), { once: true });
  }

  /* ───────── Confetti ───────── */
  function confetti(x, y) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = ["#6366f1", "#a855f7", "#ec4899", "#f59e0b", "#10b981", "#38bdf8"];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement("div");
      p.className = "confetti";
      p.style.background = colors[i % colors.length];
      document.body.appendChild(p);
      const angle = Math.random() * Math.PI * 2;
      const vel = 140 + Math.random() * 260;
      const dx = Math.cos(angle) * vel;
      const dy = Math.sin(angle) * vel - 220;
      const rot = (Math.random() - 0.5) * 900;
      p.animate([
        { transform: `translate(${x}px, ${y}px) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${x + dx}px, ${y + dy + 420}px) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: 1300 + Math.random() * 700, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => p.remove();
    }
  }

  /* ───────── Drag & drop reordering ───────── */
  let dragId = null;
  list.addEventListener("dragstart", (e) => {
    const li = e.target.closest(".task");
    if (!li) return;
    dragId = li.dataset.id;
    li.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.setDragImage(li, 20, 20); } catch {}
  });
  list.addEventListener("dragover", (e) => {
    if (!dragId) return;
    e.preventDefault();
    const over = e.target.closest(".task");
    list.querySelectorAll(".drag-over").forEach((el) => el !== over && el.classList.remove("drag-over"));
    if (over && over.dataset.id !== dragId) over.classList.add("drag-over");
  });
  list.addEventListener("drop", (e) => {
    e.preventDefault();
    const over = e.target.closest(".task");
    if (over && dragId && over.dataset.id !== dragId) {
      const from = tasks.findIndex((t) => t.id === dragId);
      const [moved] = tasks.splice(from, 1);
      const to = tasks.findIndex((t) => t.id === over.dataset.id);
      tasks.splice(to, 0, moved);
      render();
    }
  });
  list.addEventListener("dragend", () => {
    dragId = null;
    list.querySelectorAll(".dragging, .drag-over").forEach((el) => el.classList.remove("dragging", "drag-over"));
  });

  /* ───────── Events ───────── */
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = input.value.trim();
    if (!title) {
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      input.focus();
      return;
    }
    addTask(title);
    input.value = "";
    dateInput.value = "";
    prioInput.value = "none";
    input.focus();
  });

  list.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const li = btn.closest(".task");
    const id = li.dataset.id;
    const action = btn.dataset.action;
    if (action === "toggle") toggleTask(id, li);
    if (action === "delete") deleteTask(id, li);
    if (action === "edit") startEdit(id, li);
  });
  list.addEventListener("dblclick", (e) => {
    if (e.target.closest(".task-title")) {
      const li = e.target.closest(".task");
      startEdit(li.dataset.id, li);
    }
  });

  tabs.forEach((t) => t.addEventListener("click", () => setFilter(t.dataset.filter)));
  searchInput.addEventListener("input", () => { query = searchInput.value; render(); });
  $("#clearDone").addEventListener("click", clearCompleted);

  document.addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.key === "Escape" && document.activeElement === searchInput) { searchInput.value = ""; query = ""; render(); searchInput.blur(); }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); searchInput.focus(); }
    if (e.key.toLowerCase() === "n") { e.preventDefault(); input.focus(); }
  });

  /* ───────── Theme ───────── */
  const root = document.documentElement;
  const savedTheme = store.get(THEME_KEY, null);
  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
  $("#themeToggle").addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    store.set(THEME_KEY, root.dataset.theme);
  });

  /* ───────── Header ───────── */
  const now = new Date();
  const h = now.getHours();
  $("#greet").textContent = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  $("#date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  /* ───────── Init ───────── */
  render({ animateIds: new Set(tasks.map((t) => t.id)) });
  [...list.children].forEach((li, i) => (li.style.animationDelay = i * 50 + "ms"));
  requestAnimationFrame(moveIndicator);
  window.addEventListener("resize", moveIndicator);
  document.fonts && document.fonts.ready.then(moveIndicator);
})();
</script>
</body>
</html>
